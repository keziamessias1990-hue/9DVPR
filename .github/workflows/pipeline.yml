name: pipeline

on:
  push:
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
  code-analisys:
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true -Dsonar.projectKey=keziamessias1990-hue_9DVPR-teste
      steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Run Unit Tests
        run: mvn test

      - name: Generate Jacoco Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2.0.1

      - name: Log coverage percentage
        run: |
          echo "coverage = ${{ steps.jacoco.outputs.coverage }}"
          echo "branch coverage = ${{ steps.jacoco.outputs.branches }}"

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4.4.0
        with:
          name: jacoco-report
          path: target/site/jacoco


  build:
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: target/

      - name: Upload JAR
        uses: actions/upload-artifact@v4.4.0
        with:
          name: artifact
          path: ./target/demo-0.0.2.7-SNAPSHOT.jar

      - name: Packages
        run: mvn package


  deploy-STG:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        shell: bash
        run: |
          echo "Deploy STG"


  Smoketest:
    runs-on: ubuntu-latest
    needs: deploy-STG
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v3

      - name: Smoketest
        shell: bash
        run: |
          sh 'src/main/scripts/smoketest.sh'


  testeIntegrados:
    runs-on: ubuntu-latest
    needs: Smoketest
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v3

      - name: Testes Integrados
        shell: bash
        run: |
          sh 'src/main/scripts/testeIntegrado.sh'


  deploy-PRE:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        shell: bash
        run: |
          echo "Deploy PRE"


  SmoketestPre:
    runs-on: ubuntu-latest
    needs: deploy-PRE
    if: github.ref == 'refs/heads/release'

    steps:
      - uses: actions/checkout@v3

      - name: Smoketest PRE
        shell: bash
        run: |
          sh 'src/main/scripts/smoketest.sh'


  testeFuncionais:
    runs-on: ubuntu-latest
    needs: SmoketestPre
    if: github.ref == 'refs/heads/release'

    steps:
      - uses: actions/checkout@v3

      - name: Testes Funcionais
        shell: bash
        run: |
          sh 'src/main/scripts/testesFuncionais.sh'


  testePerformance:
    runs-on: ubuntu-latest
    needs: testeFuncionais
    if: github.ref == 'refs/heads/release'

    steps:
      - uses: actions/checkout@v3

      - name: Testes de Performance
        shell: bash
        run: |
          sh 'src/main/scripts/testesPerformance.sh'


  deploy-Prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy PROD
        shell: bash
        run: |
          echo "Deploy PROD"


  smoke-Prod:
    runs-on: ubuntu-latest
    needs: deploy-Prod
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Smoke Test PROD
        shell: bash
        run: |
          sh 'src/main/scripts/smoketest.sh'


  testePerformanceProd:
    runs-on: ubuntu-latest
    needs: smoke-Prod
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Testes de Performance PROD
        shell: bash
        run: |
          sh 'src/main/scripts/testesPerformance.sh'
